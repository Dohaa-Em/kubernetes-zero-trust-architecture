apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: secrets-only-from-eso
  annotations:
    policies.kyverno.io/title: Secrets in zt-data only from External Secrets Operator
    policies.kyverno.io/category: Secrets
spec:
  background: false
  rules:
    - name: deny-secrets-not-written-by-eso
      match:
        any:
          - resources:
              kinds: [Secret]
              namespaces: [zt-data]
              operations: [CREATE, UPDATE]
      validate:
        failureAction: Enforce
        allowExistingViolations: false
        message: "Secrets in zt-data may only be written by the External Secrets Operator."
        deny:
          conditions:
            all:
              - key: "{{ request.userInfo.username }}"
                operator: NotEquals
                value: "system:serviceaccount:external-secrets:external-secrets"
