apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata: {name: zt-admission-policies}
policies:
  - ../10-disallow-latest-tag.yaml
  - ../20-require-limits.yaml
resources:
  - resources.yaml
results:
  - {policy: best-practices-disallow-latest-tag, rule: validate-image-tag, resources: [good-pod], kind: Pod, result: pass}
  - {policy: best-practices-disallow-latest-tag, rule: validate-image-tag, resources: [bad-pod], kind: Pod, result: fail}
  - {policy: best-practices-require-limits, rule: require-cpu-memory-limits, resources: [good-pod], kind: Pod, result: pass}
  - {policy: best-practices-require-limits, rule: require-cpu-memory-limits, resources: [bad-pod], kind: Pod, result: fail}
