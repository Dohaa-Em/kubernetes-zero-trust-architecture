# cluster/audit/k3s-secrets-encryption.yaml
# Fichier "drop-in" k3s, copié dans /etc/rancher/k3s/config.yaml.d/30-secrets-encryption.yaml
# Sur un cluster NEUF (phase 7, reconstruction) : copier ce fichier AVANT
# d'installer k3s -> les Secrets sont chiffrés (AES-CBC) dès le premier jour.
# Sur un cluster EXISTANT : suivre la procédure "enable" de MA-PARTIE.md (étape 6.3).
secrets-encryption: true
