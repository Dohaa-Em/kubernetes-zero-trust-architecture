apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-frontend-to-api-egress, namespace: zt-frontend}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: frontend}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: zt-api}
          podSelector:
            matchLabels: {app.kubernetes.io/component: api}
      ports:
        - {protocol: TCP, port: 9898}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-frontend-to-api-ingress, namespace: zt-api}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: zt-frontend}
          podSelector:
            matchLabels: {app.kubernetes.io/component: frontend}
      ports:
        - {protocol: TCP, port: 9898}
