# Flux de Falco et Falcosidekick (docs/flows-falco.md, F1 à F5)
# Les pods se distinguent par app.kubernetes.io/component : core, ui, ui-redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all, namespace: falco}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# F1 : Falco -> Falcosidekick 2801
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-falco-to-sidekick-egress, namespace: falco}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: falco}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: falcosidekick, app.kubernetes.io/component: core}
      ports:
        - {protocol: TCP, port: 2801}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-falco-to-sidekick-ingress, namespace: falco}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: falcosidekick, app.kubernetes.io/component: core}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: falco}
      ports:
        - {protocol: TCP, port: 2801}
---
# F2 : Falcosidekick -> interface 2802
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-sidekick-to-ui-egress, namespace: falco}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: falcosidekick, app.kubernetes.io/component: core}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: falcosidekick, app.kubernetes.io/component: ui}
      ports:
        - {protocol: TCP, port: 2802}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-sidekick-to-ui-ingress, namespace: falco}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: falcosidekick, app.kubernetes.io/component: ui}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: falcosidekick, app.kubernetes.io/component: core}
      ports:
        - {protocol: TCP, port: 2802}
---
# F3 : interface -> Redis 6379
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ui-to-redis-egress, namespace: falco}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: falcosidekick, app.kubernetes.io/component: ui}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: falcosidekick, app.kubernetes.io/component: ui-redis}
      ports:
        - {protocol: TCP, port: 6379}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ui-to-redis-ingress, namespace: falco}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: falcosidekick, app.kubernetes.io/component: ui-redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: falcosidekick, app.kubernetes.io/component: ui}
      ports:
        - {protocol: TCP, port: 6379}
---
# F5 : DNS pour tous les pods du namespace falco
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-dns-egress, namespace: falco}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
---
# F4 : téléchargement des règles et du plugin par falcoctl (index sur falcosecurity.github.io,
# artefacts sur ghcr.io, blobs redirigés vers des CDN dont les adresses changent).
# Limite assumée : HTTPS sortant ouvert pour le seul pod Falco, pas de filtre par nom de domaine.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-falco-rules-download, namespace: falco}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: falco}
  egress:
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
