# detection/tests/token-reader-pod.yaml
# Pod de test TEMPORAIRE pour déclencher la règle "ZT Read of service account token".
# Depuis la phase 2, aucun pod applicatif ne monte de token : on en crée un qui
# le monte explicitement, en respectant PSA restricted et les politiques Kyverno
# (image autorisée, tag explicite, limites). A supprimer après le test.
apiVersion: v1
kind: Pod
metadata:
  name: falco-token-test
  namespace: zt-attacker
  labels:
    app.kubernetes.io/name: falco-token-test
    app.kubernetes.io/component: test
    app.kubernetes.io/part-of: zero-trust-k8s
    zt/zone: attacker
spec:
  serviceAccountName: sa-attacker
  automountServiceAccountToken: true     # volontaire, pour le test uniquement
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: reader
      image: curlimages/curl:8.10.1
      command: ["sh", "-c", "sleep 5; head -c 20 /var/run/secrets/kubernetes.io/serviceaccount/token >/dev/null; sleep 30"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits:   {cpu: 100m, memory: 64Mi}
