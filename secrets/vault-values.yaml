# secrets/vault-values.yaml
# Vault en mode "lab" : un seul réplica, stockage intégré Raft, TLS désactivé
# à l'intérieur du cluster. Limites assumées (à citer dans le rapport) :
# en production -> TLS, auto-unseal (KMS/HSM), 3 réplicas Raft.
# Vérifier les clés avec : helm show values hashicorp/vault --version <V>
global:
  tlsDisable: true

injector:
  enabled: false          # on utilise ESO, pas l'injection par sidecar

server:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {cpu: 500m, memory: 512Mi}
  dataStorage:
    enabled: true
    size: 2Gi
  auditStorage:           # volume monté sur /vault/audit (journal d'audit Vault)
    enabled: true
    size: 1Gi
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

ui:
  enabled: true
