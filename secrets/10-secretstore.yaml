# secrets/10-secretstore.yaml
# SecretStore (et non ClusterSecretStore) : limité au namespace zt-data.
# Un ClusterSecretStore pourrait être référencé depuis n'importe quel namespace,
# ce qui élargirait le blast radius en cas de compromission d'un namespace.
# Vérifier la version d'API avec : kubectl api-resources | grep -i secretstore
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: zt-data
  labels:
    app.kubernetes.io/part-of: zero-trust-k8s
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso"
          # ESO demande un token éphémère pour eso-vault via l'API TokenRequest :
          # aucun token n'est monté ni stocké (automountServiceAccountToken: false).
          serviceAccountRef:
            name: eso-vault
            audiences: ["vault"]
