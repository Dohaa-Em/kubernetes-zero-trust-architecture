# secrets/20-externalsecret-db.yaml
# ESO crée et possède le Secret db-creds à partir de Vault.
# IMPORTANT : avec creationPolicy Owner, ESO refuse de prendre le contrôle d'un
# Secret existant qu'il n'a pas créé. Il faut donc supprimer le db-creds créé
# à la main en phase 1 APRES avoir copié sa valeur dans Vault (vault-configure.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: zt-data
  labels:
    app.kubernetes.io/part-of: zero-trust-k8s
spec:
  refreshInterval: 1m          # court pour la démo de rotation (1h en prod)
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: db-creds
    creationPolicy: Owner      # ownerReference -> on prouve que le Secret est géré par ESO
    deletionPolicy: Retain     # si la clé disparaît de Vault, on garde la dernière valeur
  data:
    - secretKey: password
      remoteRef:
        key: zt/database/credentials
        property: password
