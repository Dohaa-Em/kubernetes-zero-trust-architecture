apiVersion: v1
kind: Pod
metadata:
  name: bypass-test
  namespace: zt-attacker
  labels: {app.kubernetes.io/name: bypass-test, app.kubernetes.io/part-of: zero-trust-k8s}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
  initContainers:
    - name: init
      image: alpine:latest            # image hors liste ET tag latest, sans limites
      command: ["sh", "-c", "echo init"]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
  containers:
    - name: main
      image: curlimages/curl:8.10.1   # conforme
      command: ["sleep", "5"]
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      resources: {limits: {cpu: 50m, memory: 32Mi}}
