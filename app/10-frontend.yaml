apiVersion: v1
kind: ServiceAccount
metadata: {name: sa-frontend, namespace: zt-frontend}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: frontend-nginx, namespace: zt-frontend}
data:
  default.conf: |
    server {
      listen 8080;
      location / { default_type text/plain; return 200 "frontend ok\n"; }
      location /api/ { proxy_pass http://api.zt-api.svc.cluster.local:9898/; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: zt-frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: zero-trust-k8s
        zt/zone: entry
    spec:
      serviceAccountName: sa-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports: [{containerPort: 8080}]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: conf, mountPath: /etc/nginx/conf.d}
        readinessProbe:
          httpGet: {path: /, port: 8080}
      volumes:
      - {name: tmp, emptyDir: {}}
      - name: conf
        configMap: {name: frontend-nginx}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: zt-frontend}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports: [{port: 8080, targetPort: 8080}]
