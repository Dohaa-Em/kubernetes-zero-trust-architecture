apiVersion: v1
kind: ServiceAccount
metadata: {name: sa-api, namespace: zt-api}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: zt-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: zero-trust-k8s
        zt/zone: app
    spec:
      serviceAccountName: sa-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.7.1
        command: ["./podinfo", "--port=9898"]
        ports: [{containerPort: 9898}]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /healthz, port: 9898}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: zt-api}
spec:
  selector: {app.kubernetes.io/name: api}
  ports: [{port: 9898, targetPort: 9898}]
